[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dukascopy-market-data"
version = "0.1.0"
description = "Download and aggregate Dukascopy market data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=25.0",
]

[project.scripts]
dukascopy = "dukascopy_market_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
